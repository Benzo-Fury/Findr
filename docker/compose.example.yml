# External services Findr depends on: Prowlarr (indexer search), plus
# FlareSolverr as an opt-in helper for indexers behind Cloudflare. Findr
# itself runs outside this stack, on the host, and downloads torrents with its
# own built-in client.
#
#   cp compose.example.yml compose.yml && cp .env.example .env   # then edit .env
#   docker compose up -d                                         # add --profile flaresolverr to include it
#
# See README.md in this folder for first-run setup.

name: findr-services

services:
  # ---------- Prowlarr ---------- #
  # Indexer manager. Findr queries its search API with PROWLARR_API_KEY.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: findr-prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Pins the API key so Findr's .env and Prowlarr agree from the first start
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY:?set PROWLARR_API_KEY in .env}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  # ---------- FlareSolverr (optional) ---------- #
  # Solves Cloudflare challenges for indexers that need it. Only started with
  # `--profile flaresolverr`; add it in Prowlarr as an indexer proxy at
  # http://flaresolverr:8191 and tag the indexers that need it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG:-latest}
    container_name: findr-flaresolverr
    profiles: [flaresolverr]
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=info
    restart: unless-stopped
