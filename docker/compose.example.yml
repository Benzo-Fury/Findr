# The whole Findr stack in one file: Findr itself, Prowlarr (indexer search),
# and FlareSolverr as an opt-in helper for indexers behind Cloudflare. Findr
# downloads torrents with its own built-in client, so nothing else is needed.
#
#   cp compose.example.yml compose.yml && cp .env.example .env   # then edit .env
#   docker compose up -d                                         # add --profile flaresolverr to include it
#
# Running Findr on the host instead (binary or source)? Start only Prowlarr
# with `docker compose up -d prowlarr`. See README.md in this folder for
# first-run setup.

name: findr

services:
  # ---------- Findr ---------- #
  # The downloader and web app. Open http://localhost:34571 after the
  # first-sign-in step in README.md. Prowlarr URL in Findr's settings:
  # http://prowlarr:9696
  findr:
    image: ghcr.io/benzo-fury/findr:${FINDR_TAG:-latest}
    container_name: findr
    # Must own the library folders on the host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      # Database, session secret, optional .env
      - ${CONFIG_ROOT:-./config}/findr:/data
      # Library and scratch folders, at the same path inside and out so the
      # paths entered under Settings -> Library paths match
      - ${MEDIA_ROOT:-/srv/media}:${MEDIA_ROOT:-/srv/media}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${FINDR_PORT:-34571}:34571
      # Torrent port (TCP and UDP); forward it on your router for better speeds
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp
    depends_on:
      - prowlarr
    restart: unless-stopped

  # ---------- Prowlarr ---------- #
  # Indexer manager. Findr queries its search API with PROWLARR_API_KEY.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: findr-prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Pins the API key so Findr's .env and Prowlarr agree from the first start
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY:?set PROWLARR_API_KEY in .env}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  # ---------- FlareSolverr (optional) ---------- #
  # Solves Cloudflare challenges for indexers that need it. Only started with
  # `--profile flaresolverr`; add it in Prowlarr as an indexer proxy at
  # http://flaresolverr:8191 and tag the indexers that need it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG:-latest}
    container_name: findr-flaresolverr
    profiles: [flaresolverr]
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=info
    restart: unless-stopped
