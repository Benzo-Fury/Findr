# The whole Findr stack in one file: Findr itself, Prowlarr (indexer search),
# and FlareSolverr as an opt-in helper for indexers behind Cloudflare. Findr
# downloads torrents with its own built-in client, so nothing else is needed.
# Every setting has a default, so no .env is needed either:
#
#   mkdir -p findr/config/findr findr/config/prowlarr findr/media && cd findr
#   curl -fsSL https://github.com/Benzo-Fury/Findr/releases/latest/download/compose.yml -o compose.yml
#   docker compose up -d                  # add --profile flaresolverr to include it
#
# Then open http://localhost:34571 and enter the setup code from
# `docker compose logs findr`. To change a default, copy .env.example to .env.
#
# Running Findr on the host instead (binary or source)? Start only Prowlarr
# with `docker compose up -d prowlarr`. See README.md in this folder.

name: findr

services:
  # ---------- Findr ---------- #
  # The downloader and web app. Finds Prowlarr by itself: its address is
  # given below and its API key is read from Prowlarr's own config file.
  findr:
    image: ghcr.io/benzo-fury/findr:${FINDR_TAG:-latest}
    container_name: findr
    # Must own the library folders on the host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_CONFIG=/prowlarr/config.xml
    volumes:
      # Database, session secret, extracted tools
      - ${CONFIG_ROOT:-./config}/findr:/data
      # Library and downloads. Findr starts with /media/movies, /media/tv and
      # /media/downloads, all on this one mount so saving is a quick rename
      - ${MEDIA_ROOT:-./media}:/media
      # Prowlarr's settings, read-only, for its API key
      - ${CONFIG_ROOT:-./config}/prowlarr:/prowlarr:ro
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${FINDR_PORT:-34571}:34571
      # Torrent port (TCP and UDP); forward it on your router for better speeds
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp
    depends_on:
      - prowlarr
    restart: unless-stopped

  # ---------- Prowlarr ---------- #
  # Indexer manager. Findr queries its search API with the key Prowlarr
  # generates on first start.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: findr-prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  # ---------- FlareSolverr (optional) ---------- #
  # Solves Cloudflare challenges for indexers that need it. Only started with
  # `--profile flaresolverr`; add it in Prowlarr as an indexer proxy at
  # http://flaresolverr:8191 and tag the indexers that need it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG:-latest}
    container_name: findr-flaresolverr
    profiles: [flaresolverr]
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=info
    restart: unless-stopped
