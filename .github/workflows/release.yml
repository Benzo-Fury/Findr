# Builds the standalone executable for every supported platform and attaches
# them, with SHA-256 checksums, to the GitHub release that triggered the run.
#
# The build contains no native code, so a single runner cross-compiles every
# target. It runs on macOS so the darwin executables can be ad-hoc signed —
# Apple Silicon refuses to run an unsigned binary.

name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: >-
          bun run build
          --target linux-x64
          --target linux-arm64
          --target darwin-x64
          --target darwin-arm64
          --target windows-x64

      - name: Sign macOS executables
        run: |
          for binary in dist/findr-darwin-*; do
            codesign --force --sign - "$binary"
          done

      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 findr-* > SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/findr-* dist/SHA256SUMS.txt --clobber
