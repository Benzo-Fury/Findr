# Builds the standalone executable for every supported platform and attaches
# them, with SHA-256 checksums, to the GitHub release that triggered the run,
# then packages the Linux executables into a multi-platform container image
# pushed to the GitHub Container Registry (ghcr.io/<owner>/findr).
#
# The build contains no native code, so a single runner cross-compiles every
# target. It runs on macOS so the darwin executables can be ad-hoc signed —
# Apple Silicon refuses to run an unsigned binary.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each executable reports the release's tag as its version
      - name: Build
        env:
          FINDR_VERSION: ${{ github.event.release.tag_name }}
        run: >-
          bun run build
          --target linux-x64
          --target linux-arm64
          --target darwin-x64
          --target darwin-arm64
          --target windows-x64

      - name: Sign macOS executables
        run: |
          for binary in dist/findr-darwin-*; do
            codesign --force --sign - "$binary"
          done

      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 findr-* > SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/findr-* dist/SHA256SUMS.txt --clobber

      # The image job packages these exact executables rather than building its own
      - name: Keep the Linux executables for the image
        uses: actions/upload-artifact@v7
        with:
          name: linux-executables
          path: dist/findr-linux-*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the Linux executables
        uses: actions/download-artifact@v8
        with:
          name: linux-executables
          path: dist

      # Registry names must be lowercase; the owner may not be
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/findr" >> "$GITHUB_ENV"

      # Tags: 1.4.0 and 1.4 for every release; latest only for full releases
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ !github.event.release.prerelease }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}

      # The executables are prebuilt, but the image's apt step runs per platform
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
