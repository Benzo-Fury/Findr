# Runs the API test suite and type checks the API and the web app on every
# push and pull request. The release workflow calls it too, so nothing is built
# for a release whose code fails either.
#
# The ffmpeg and ffprobe that releases embed are installed, so the Sterilizer,
# pipeline and playback tests run against them rather than skip.

name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The build releases embed, pinned and hash-checked in tools.json, rather than the distribution's
      - name: Install the pinned ffmpeg
        run: |
          pin='.targets["linux-x64"].ffmpeg'
          url=$(jq -r "$pin.url" apps/api/scripts/tools.json)
          sha=$(jq -r "$pin.sha256" apps/api/scripts/tools.json)
          curl -fsSL "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "$sha  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" ffmpeg ffprobe
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the API
        working-directory: apps/api
        run: bun test

      # The type checker needs the generated build maps, empty where they would embed files
      - name: Type check the API
        working-directory: apps/api
        run: |
          bun run scripts/cartographer.ts
          bun run scripts/assetmap.ts --allow-empty
          bun run scripts/toolmap.ts --empty
          bunx tsc --noEmit

      - name: Type check the web app
        working-directory: apps/web
        run: bunx tsc -b
